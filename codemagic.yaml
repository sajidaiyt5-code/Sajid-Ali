workflows:
  android-workflow:
    name: Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Build Debug APK
        script: |
          ls -la
          chmod +x gradlew || true
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug
          else
            gradle wrapper
            chmod +x gradlew
            ./gradlew assembleDebug
          fi
    artifacts:
      - app/build/outputs/apk/debug/*.apk
