workflows:
  android-workflow:
    name: Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      android: true
      java: 17
    scripts:
      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
